# Configuración para publicar en Netlify.
# Netlify lee este archivo solo: no hay que configurar nada a mano en su panel.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Direcciones del sitio anterior (Wix) que llevan a su página nueva,
# para no perder las visitas ni la posición en Google.
[[redirects]]
  from = "/contacto"
  to = "/ubicacion/"
  status = 301

[[redirects]]
  from = "/comidasycenas"
  to = "/restaurante/"
  status = 301

[[redirects]]
  from = "/reserva-tu-habitacion"
  to = "/habitaciones/"
  status = 301

# Los archivos con huella en el nombre nunca cambian: se guardan un año.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
